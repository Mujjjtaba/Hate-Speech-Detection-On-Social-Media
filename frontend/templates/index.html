<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hate Speech Detector</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        .hidden {
            display: none;
        }

        .result {
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            background: rgba(128, 128, 128, 0.10);
        }

        .graphs img {
            max-width: 100%;
            height: auto;
            margin: 12px 0;
        }

        #error-message {
            color: #b00020;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛡️ Hate Speech Detection</h1>

        <form id="prediction-form">

            <textarea
                name="text"
                placeholder="Enter a sentence..."
                required
            ></textarea>

            <button id="predict-button" type="submit">
                Predict
            </button>

        </form>

        <p id="error-message" role="alert"></p>

        <div id="results" class="hidden">

            <h2>🔍 Prediction Results</h2>

            <p>
                <strong>Input:</strong>
                <span id="input-text"></span>
            </p>

            <div class="result">

                <h3>Logistic Regression</h3>

                <p>
                    <strong>Prediction:</strong>
                    <span id="logreg-pred"></span>
                </p>

                <p>
                    <strong>Hate Probability:</strong>
                    <span id="logreg-prob"></span>
                </p>

                <p>
                    <strong>Test Accuracy:</strong>
                    <span id="logreg-acc"></span>
                </p>

            </div>

            <div class="result">

                <h3>XGBoost</h3>

                <p>
                    <strong>Prediction:</strong>
                    <span id="xgb-pred"></span>
                </p>

                <p>
                    <strong>Hate Probability:</strong>
                    <span id="xgb-prob"></span>
                </p>

                <p>
                    <strong>Test Accuracy:</strong>
                    <span id="xgb-acc"></span>
                </p>

            </div>

        </div>

        <h2>📊 Data Visualizations</h2>

        <div class="graphs">

            <img
                src="{{ url_for('graph_file', filename='label_distribution.png') }}"
                alt="Label Distribution"
            >

            <img
                src="{{ url_for('graph_file', filename='model_accuracy.png') }}"
                alt="Model Accuracy Comparison"
            >

            <img
                src="{{ url_for('graph_file', filename='model_training_time.png') }}"
                alt="Model Training Time"
            >

            <img
                src="{{ url_for('graph_file', filename='confusion_matrices.png') }}"
                alt="Confusion Matrices"
            >

            <img
                src="{{ url_for('graph_file', filename='wordcloud_hate.png') }}"
                alt="Hate Speech Word Cloud"
            >

            <img
                src="{{ url_for('graph_file', filename='wordcloud_not_hate.png') }}"
                alt="Not Hate Speech Word Cloud"
            >

        </div>

    </div>

    <script>

        const form = document.getElementById("prediction-form");

        const button = document.getElementById("predict-button");

        const errorMessage = document.getElementById("error-message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            errorMessage.textContent = "";

            button.disabled = true;

            button.textContent = "Predicting...";


            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    body: new FormData(form)

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Prediction failed."
                    );

                }


                // Input text
                document.getElementById(
                    "input-text"
                ).textContent = data.input_text;


                // Logistic Regression results
                document.getElementById(
                    "logreg-pred"
                ).textContent =
                    data.logistic_regression.prediction;

                document.getElementById(
                    "logreg-prob"
                ).textContent =
                    data.logistic_regression.hate_probability;

                document.getElementById(
                    "logreg-acc"
                ).textContent =
                    data.logistic_regression.accuracy;


                // XGBoost results
                document.getElementById(
                    "xgb-pred"
                ).textContent =
                    data.xgboost.prediction;

                document.getElementById(
                    "xgb-prob"
                ).textContent =
                    data.xgboost.hate_probability;

                document.getElementById(
                    "xgb-acc"
                ).textContent =
                    data.xgboost.accuracy;


                // Show results
                document.getElementById(
                    "results"
                ).classList.remove("hidden");


            } catch(error) {

                errorMessage.textContent = error.message;

            } finally {

                button.disabled = false;

                button.textContent = "Predict";

            }

        });

    </script>

</body>

</html>
